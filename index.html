<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gestor de tarefas</title>
</head>
<body>
    <h1>Gestor de tarefas</h1>
    <div>
        <p>Organiza as tuas tarefas diárias</p>
        <form>
            <input type="text" id="task-input" placeholder="Escreve uma tarefa...">
            <button type="submit">Adicionar tarefa</button>
        </form>
    </div>
    <div>
        <h2>As minhas tarefas</h2>
        <ul id="task-list">
            <li>Estudar HTML</li>
            <li>Praticar CSS</li>
        </ul>
    </div>

</body>
</html>
